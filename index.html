<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>휴무신청서 작성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 현장용 업무 도구, 짧고 분명하게
   IDEA: 사무실 서류함의 신청서 한 장 — 입력하면 그 종이에 바로 적힌다
   PICTURE: 실제 신청서 미리보기가 화면의 주인공
   COLOUR and TYPE: 흰 종이, 진한 잉크, 결재 도장 같은 파랑 하나 / Noto Sans KR
   LAYOUT: 넓으면 입력 왼쪽·종이 오른쪽, 폰에서는 입력 → 종이 → 저장 */
:root{color-scheme:light dark;--bg:light-dark(#eef0f3,#15171b);--card:light-dark(#fff,#1f2228);--ink:light-dark(#16181d,#eceef2);--mute:light-dark(#5d6470,#9aa1ad);--line:light-dark(#d5d9e0,#353a44);--acc:#1f4fd1;--accs:light-dark(#e6edff,#22305a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
header{padding:22px max(4vw,16px) 6px;max-width:1240px;margin:auto}
h1{font-size:clamp(24px,3.4vw,34px);line-height:1.1;margin:0 0 4px;font-weight:700}
header p{margin:0;color:var(--mute);font-size:15px}
main{max-width:1240px;margin:auto;padding:14px max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.f{margin-bottom:16px}
label{display:block;font-weight:500;font-size:15px;margin-bottom:6px}
label small{color:var(--mute);font-weight:400}
input,textarea{width:100%;font:16px "Noto Sans KR",sans-serif;padding:11px 12px;min-height:46px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
textarea{resize:vertical;min-height:70px}
input:disabled{opacity:.45;cursor:not-allowed}
input:focus,textarea:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--acc) 45%,transparent);outline-offset:1px;border-color:var(--acc)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font:14px "Noto Sans KR",sans-serif;padding:7px 12px;min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button:hover{border-color:var(--acc);color:var(--acc)}
.sum{background:var(--accs);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:8px}
.sum b{color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:6px}
.chk input{width:20px;min-height:20px}
.paper{position:relative}
.paper canvas{width:100%;height:auto;display:block;background:#fff;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px rgba(20,30,60,.14)}
.paper img{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{flex:1 1 160px;font:500 16px "Noto Sans KR",sans-serif;min-height:50px;border-radius:12px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
.msg{min-height:22px;font-size:14px;color:var(--mute);margin-top:8px}
.tip{font-size:13px;color:var(--mute);margin-top:4px}
.guide{display:none;flex:1 1 100%;background:#fff6d6;color:#3d2f00;border:1.5px solid #f2c94c;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.45}
.guide b{color:#b42318}
.acts.on .guide{display:block;margin-bottom:50px;animation:pop .35s ease-out}
#bPng{position:relative}
.hint{display:none;position:absolute;left:50%;bottom:100%;transform:translateX(-50%);flex-direction:column;align-items:center;gap:5px;padding-bottom:4px;pointer-events:none}
.acts.on .hint{display:flex}
.hint i{width:7px;height:7px;border-radius:50%;background:#e5484d;opacity:.2;animation:dot 1.2s infinite}
.hint i:nth-child(2){animation-delay:.2s}.hint i:nth-child(3){animation-delay:.4s}
.hint em{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:12px solid #e5484d;animation:dot 1.2s .6s infinite;opacity:.2}
.acts.on #bPng{background:#e5484d;animation:pulse 1.6s infinite}
@keyframes dot{0%,100%{opacity:.2;transform:translateY(-2px)}40%{opacity:1;transform:translateY(2px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}60%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.hint i,.hint em,.acts.on #bPng,.acts.on .guide{animation:none;opacity:1}}
.float{display:none;position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;align-items:center;gap:10px;background:#e5484d;color:#fff;border:0;border-radius:999px;padding:12px 20px;min-height:48px;font:700 16px "Noto Sans KR",sans-serif;box-shadow:0 8px 24px rgba(229,72,77,.45);cursor:pointer;white-space:nowrap;animation:pop .35s ease-out}
.float.show{display:flex}
.fd{display:flex;flex-direction:column;align-items:center;gap:3px}
.fd i{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.25;animation:dot 1.2s infinite}
.fd i:nth-child(2){animation-delay:.2s}.fd i:nth-child(3){animation-delay:.4s}
.fd em{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #fff;opacity:.25;animation:dot 1.2s .6s infinite}
@media(prefers-reduced-motion:reduce){.fd i,.fd em{animation:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:50;background:#1b1e24;display:flex;flex-direction:column}
.modal[hidden]{display:none}
.mbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px max(3vw,12px);background:var(--card);color:var(--ink)}
.mbar b{font-size:17px}.msub{color:var(--mute);font-size:13px;margin-right:auto}
.btn.mini{flex:0 0 auto;min-height:44px;padding:0 16px;font-size:15px}
.mbar .btn.sec{background:transparent}
.x{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;cursor:pointer}
.mbody{flex:1;overflow:auto;padding:20px;display:flex;justify-content:center;align-items:flex-start}
.mbody img{width:min(820px,100%);height:auto;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4);cursor:zoom-in}
.mbody.zoom img{width:1653px;max-width:none;cursor:zoom-out}
.mmsg{color:#fff;text-align:center;font-size:14px;padding:0 12px 12px;min-height:20px}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.acts{margin-top:14px}}
</style>
</head>
<body>
<header>
  <h1>휴무신청서 작성</h1>
  <p>칸을 채우면 신청서에 바로 들어갑니다. 이미지(PNG)나 PDF로 저장해서 출력하세요.</p>
</header>
<main>
  <form class="panel" id="frm" autocomplete="on">
    <div class="f"><label for="name">성명</label><input id="name" placeholder="홍길동" required></div>
    <div class="f">
      <label>휴무 기간</label>
      <label class="chk" style="margin:0 0 8px"><input type="checkbox" id="oneday" checked> 당일 (하루만 쉬어요)</label>
      <div class="row">
        <div><label for="d1"><small>시작일</small></label><input type="date" id="d1"></div>
        <div><label for="d2"><small>종료일</small></label><input type="date" id="d2"></div>
      </div>
      <div class="sum" id="sum">날짜를 고르세요</div>
    </div>
    <div class="f">
      <label for="reason">사유</label>
      <textarea id="reason" rows="2" placeholder="예: 가족행사 (유치원 부모참여)"></textarea>
      <div class="chips" id="chips"></div>
    </div>
    <div class="f"><label for="phone">긴급연락처</label><input id="phone" type="tel" inputmode="tel" placeholder="010-0000-0000"></div>
    <div class="f"><label for="wd">작성일 <small>(기본: 오늘)</small></label><input type="date" id="wd"></div>
    <label class="chk"><input type="checkbox" id="remember" checked> 이 기기에서 성명·연락처 기억하기</label>
  </form>
  <section>
    <div class="paper"><canvas id="cv" width="1653" height="2337" aria-label="휴무신청서 미리보기"></canvas><img id="img" alt="휴무신청서 이미지"></div>
    <div class="acts" id="acts">
      <div class="guide" id="guide" role="status"><b>이인제 팀장님, 요거 누르세요!</b> 아래 빨간 <b>이미지(PNG) 저장</b> 버튼을 누르면 저장돼요. 저장된 이미지를 출력하시면 됩니다</div>
      <button class="btn sec" id="bView" type="button">미리보기</button>
      <button class="btn" id="bPng" type="button"><span class="hint" aria-hidden="true"><i></i><i></i><i></i><em></em></span>이미지(PNG) 저장</button>
      <button class="btn sec" id="bPdf" type="button">PDF 저장</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="tip" id="tip">저장 버튼이 안 되면 미리보기 이미지를 길게 누르거나(휴대폰) 오른쪽 클릭(PC)해서 저장하세요.</div>
  </section>
</main>
<button class="float" id="float" type="button">이인제 팀장님, 요거 누르세요 <span class="fd" aria-hidden="true"><i></i><i></i><i></i><em></em></span></button>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="출력 미리보기" hidden>
  <div class="mbar">
    <b>출력 미리보기</b><span class="msub">A4 · 실제 출력 모양</span>
    <button class="btn mini" id="mPng" type="button">PNG 저장</button>
    <button class="btn mini sec" id="mPdf" type="button">PDF 저장</button>
    <button class="x" id="mClose" type="button" aria-label="닫기">닫기 ✕</button>
  </div>
  <div class="mbody" id="mbody"><img id="mImg" alt="출력될 휴무신청서"></div>
  <div class="mmsg" id="mmsg"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),S=cv.width/595;
const WK=['일','월','화','수','목','금','토'];
const REASONS=['개인사정','가족행사','병가','경조사','예비군 훈련','민방위 훈련','병원 진료'];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=v=>{if(!v)return null;const[a,b,c]=v.split('-').map(Number);return new Date(a,b-1,c)};
const today=new Date();
$('wd').value=iso(today);

let store=null;try{store=window.localStorage;store.getItem('x')}catch(e){store=null}
const saved=k=>{try{return store?store.getItem('hm_'+k)||'':''}catch(e){return''}};
$('name').value=saved('name');$('phone').value=saved('phone');
const remember=()=>{try{if(!store)return;if($('remember').checked){store.setItem('hm_name',$('name').value);store.setItem('hm_phone',$('phone').value)}else{store.removeItem('hm_name');store.removeItem('hm_phone')}}catch(e){}};

function periodText(){
  const a=parse($('d1').value);let b=parse($('d2').value);
  if(!a)return{t:'',s:'날짜를 고르세요'};
  if(!b||b<a)b=a;
  const days=Math.round((b-a)/864e5)+1;
  const f=d=>`${d.getMonth()+1}월 ${d.getDate()}일 (${WK[d.getDay()]})`;
  const n=`${days}일`;
  const t=days===1?`${a.getFullYear()}년 ${f(a)} / ${n}`:`${a.getFullYear()}년 ${f(a)} ~ ${b.getFullYear()!==a.getFullYear()?b.getFullYear()+'년 ':''}${f(b)} / ${n}`;
  return{t,s:`<b>${n}</b> · ${t}`};
}

function fit(text,max,size){let s=size;ctx.font=`500 ${s*S}px "Noto Sans KR"`;while(ctx.measureText(text).width>max*S&&s>7){s-=.5;ctx.font=`500 ${s*S}px "Noto Sans KR"`}return s}
function center(text,cx,base,size,max){if(!text)return;fit(text,max||330,size);ctx.fillText(text,cx*S,base*S)}
function wrap(text,max,size){ctx.font=`500 ${size*S}px "Noto Sans KR"`;const out=[];for(const para of text.split('\n')){let line='';for(const ch of para){const t=line+ch;if(ctx.measureText(t).width>max*S&&line){out.push(line);line=ch}else line=t}out.push(line)}return out}

const bg=new Image();let ready=false;
function draw(){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  if(ready)ctx.drawImage(bg,0,0,cv.width,cv.height);
  ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='alphabetic';
  const name=$('name').value.trim(),p=periodText(),reason=$('reason').value.trim(),phone=$('phone').value.trim(),wd=parse($('wd').value);
  $('sum').innerHTML=p.s;
  center(name,340,295,11);
  center(p.t,340,404,11);
  if(reason){let sz=11,lines=wrap(reason,320,sz);while(lines.length>3&&sz>8){sz-=.5;lines=wrap(reason,320,sz)}lines=lines.slice(0,3);const lh=sz*1.45,top=451-(lines.length-1)*lh/2+sz*.35;lines.forEach((l,i)=>ctx.fillText(l,340*S,(top+i*lh)*S))}
  center(phone,340,506,11);
  if(wd){center(String(wd.getFullYear()),376,575,10.5,40);center(String(wd.getMonth()+1),431,575,10.5,24);center(String(wd.getDate()),476,575,10.5,24)}
  center(name,432,607,11,85);
  try{$('img').src=cv.toDataURL('image/png')}catch(e){}
  remember();
  const done=name&&$('d1').value&&reason&&phone;
  $('acts').classList.toggle('on',!!done&&!savedOnce);
  updFloat();
}
let actsSeen=false;
function updFloat(){const f=document.getElementById('float');if(f)f.classList.toggle('show',$('acts').classList.contains('on')&&!actsSeen)}
let savedOnce=false;

let dl=null;
function check(){if(!$('name').value.trim()||!$('d1').value){msg('성명과 휴무 날짜를 먼저 입력해 주세요.');return false}return true}
const blobOf=()=>new Promise(r=>cv.toBlob(r,'image/png'));
async function save(kind){
  if(!check())return;draw();
  try{
    let data;
    if(kind==='png')data=await blobOf();
    else{const{jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'a4'});doc.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,595.28,841.89);data=doc.output('blob')}
    if(dl)await dl.save({filename:fname(kind),data});
    else{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=fname(kind);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}savedOnce=true;$('acts').classList.remove('on');msg('저장했어요. 저장된 이미지를 출력해서 팀장님께 제출하세요.');
  }catch(e){const c=e&&e.code;msg(c==='declined'?'저장을 취소했어요.':c==='rate_limited'?'잠시 후 다시 눌러 주세요.':c==='host_unavailable'?'이 앱에서는 저장이 안 돼요. 브라우저에서 열거나 이미지를 길게 눌러 저장하세요.':'저장하지 못했어요. 미리보기 이미지를 길게 눌러 저장하세요.')}
}
$('bPng').addEventListener('click',()=>save('png'));
$('mPng').addEventListener('click',()=>save('png'));
$('mPdf').addEventListener('click',()=>save('pdf'));
function openView(){draw();$('mImg').src=cv.toDataURL('image/png');$('mbody').classList.remove('zoom');$('mmsg').textContent=(!$('name').value.trim()||!$('d1').value)?'성명이나 날짜가 비어 있어요.':'이미지를 누르면 크게 볼 수 있어요.';$('modal').hidden=false;document.body.style.overflow='hidden';$('mClose').focus()}
function closeView(){$('modal').hidden=true;document.body.style.overflow='';$('bView').focus()}
$('bView').addEventListener('click',openView);
$('float').addEventListener('click',()=>{$('acts').scrollIntoView({behavior:'smooth',block:'center'})});
try{const io=new IntersectionObserver(es=>{actsSeen=es[0].isIntersecting;updFloat()},{threshold:.6});io.observe($('bPng'))}catch(e){}
$('mClose').addEventListener('click',closeView);
$('mImg').addEventListener('click',()=>$('mbody').classList.toggle('zoom'));
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.id==='mbody')closeView()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeView()});
$('bPdf').addEventListener('click',()=>save('pdf'));
draw();
(async()=>{try{if(window.claude&&window.claude.use){dl=await window.claude.use('downloads')}}catch(e){dl=null}$('tip').textContent='휴대폰에서는 미리보기 이미지를 길게 눌러 사진첩에 저장할 수도 있어요.'})();
}
